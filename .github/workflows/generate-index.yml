name: Generate signed marketplace index

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/*.json"
      - "scripts/generate-index.mjs"
      - ".github/workflows/generate-index.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and sign index
        env:
          MARKETPLACE_ED25519_PRIVATE_KEY: ${{ secrets.MARKETPLACE_ED25519_PRIVATE_KEY }}
        run: node scripts/generate-index.mjs
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: regenerate signed marketplace index [skip ci]"
          git push
